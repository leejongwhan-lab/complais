<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>complAIs 로그인</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/portal.css" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      background: var(--bg-secondary, #f5f7fb);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .login-card {
      width: min(420px, 92vw);
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    }
    .brand-wrap {
      margin: 0 0 16px;
      padding: 8px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      border-radius: 10px;
    }
    .brand-wrap .brand-logo { height: 34px; }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { margin: 0 0 20px; color: #64748b; font-size: 0.95rem; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #d0d7e2;
      border-radius: 8px;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .error { color: #dc2626; margin-top: 12px; min-height: 1.2em; }
  </style>
</head>
<body class="portal-page">
  <form class="login-card" id="login-form">
    <div class="brand-wrap">
      <img src="/static/brand/complais-logo.png" alt="complAIs" class="brand-logo" />
    </div>
    <h1>로그인</h1>
    <p>계정으로 로그인하면 역할에 맞는 포털로 이동합니다.</p>
    <label for="email">이메일</label>
    <input id="email" type="email" value="admin@complais.com" required />
    <label for="password">비밀번호</label>
    <input id="password" type="password" value="password123!" required />
    <button type="submit">로그인</button>
    <div class="error" id="error"></div>
    <p style="margin-top: 16px; text-align: center; font-size: 0.9rem;">
      계정이 없으신가요? <a href="/signup.html" style="color: #2563eb; text-decoration: none;">회원가입</a>
    </p>
  </form>
  <script>
    const TOKEN_KEY = "access_token";

    function redirectByRole(role, fallback) {
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");
      if (next && next.startsWith("/")) return next;

      if (role === "platform_admin" || role === "admin") {
        return "/admin";
      }
      if (["cb_admin", "cb_manager", "cb_staff", "cb_reviewer"].includes(role)) {
        return "/cb-portal";
      }
      if (["client_admin", "client_staff", "enterprise_admin", "enterprise_user"].includes(role)) {
        return "/enterprise";
      }
      if (role === "auditor") {
        return "/auditor-portal";
      }
      return fallback || "/admin";
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const body = new URLSearchParams({ username: email, password });
      try {
        const res = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const detail = data.detail;
          const msg =
            typeof detail === "string"
              ? detail
              : detail?.[0]?.msg || `로그인 실패 (HTTP ${res.status})`;
          alert(msg);
          throw new Error(msg);
        }

        // 로그인 성공 및 세션 할당 (login_action.php $_SESSION)
        localStorage.setItem(TOKEN_KEY, data.access_token);
        localStorage.setItem("user_id", String(data.user_id ?? ""));
        localStorage.setItem("user_name", data.user_name ?? "");
        localStorage.setItem("role", data.role ?? "");

        if (data.cb_id != null) {
          localStorage.setItem("cb_id", String(data.cb_id)); // CB 데이터 격리
        } else {
          localStorage.removeItem("cb_id");
        }

        const companyId = data.client_company_id ?? data.company_id;
        if (companyId != null) {
          localStorage.setItem("client_company_id", String(companyId));
          localStorage.setItem("company_id", String(companyId));
        } else {
          localStorage.removeItem("client_company_id");
          localStorage.removeItem("company_id");
        }
        localStorage.setItem("membership_status", data.membership_status || "approved");

        window.location.href = redirectByRole(data.role, data.redirect_to || "/admin");
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
