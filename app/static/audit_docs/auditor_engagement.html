<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>심사원 위촉계약·NDA — ISO/IEC 17021-1</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
:root{--blue:#1a5fa8;--blue2:#e8f0fb;--blue3:#c5d8f5;--green:#1e7a4a;--green2:#e6f5ec;
  --green3:#b8e2c8;--amber:#8a5c00;--amber2:#fff8e1;--red:#b71c1c;--red2:#fce8e8;
  --navy:#1e3a5f;--text1:#1a1a2e;--text2:#5a6072;--text3:#9098aa;
  --border:#dde1e7;--bg:#fff;--bg2:#f7f8fa;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg2);color:var(--text1);font-size:12px}
#hdr{background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.logo{font-size:14px;font-weight:800}.logo small{font-size:10px;opacity:.75;font-weight:400;margin-left:5px}
.hdr-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hbtn{padding:5px 13px;font-size:10px;font-weight:600;border:1px solid rgba(255,255,255,.4);border-radius:6px;background:rgba(255,255,255,.15);color:#fff;cursor:pointer}
.hbtn.pri{background:#fff;color:var(--navy)}
.hbtn:disabled{opacity:.45;cursor:not-allowed}
#tab-bar{background:#fff;border-bottom:2px solid var(--border);padding:0 20px;display:flex}
.tab{padding:11px 18px;font-size:11px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;color:var(--text2);white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover{color:var(--navy);background:var(--blue2)}.tab.active{color:var(--navy);border-bottom-color:var(--navy)}
#pg{max-width:900px;margin:0 auto;padding:20px 14px 60px}
.doc-page{display:none}.doc-page.active{display:block}
.doc-wrap{background:#fff;border-radius:10px;border:1px solid var(--border);padding:30px 36px}
.doc-hd{border-bottom:3px solid var(--navy);padding-bottom:18px;margin-bottom:22px}
.doc-tag{font-size:9px;font-weight:700;color:var(--navy);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.doc-title{font-size:20px;font-weight:800;margin-bottom:3px}
.doc-sub{font-size:11px;color:var(--text2);margin-bottom:14px}
.doc-meta{display:inline-grid;grid-template-columns:auto auto;gap:3px 18px;font-size:10px;background:var(--bg2);padding:9px 16px;border-radius:7px;border:1px solid var(--border)}
.dm-lbl{color:var(--text3);font-weight:600}
.sec{margin-bottom:22px}
.sec-h{font-size:12px;font-weight:800;color:var(--navy);border-bottom:2px solid var(--blue3);padding-bottom:5px;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.sec-no{background:var(--navy);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px}
.form-tbl{width:100%;border-collapse:collapse;font-size:11px}
.form-tbl td{padding:7px 10px;border:1px solid var(--border);vertical-align:top}
.form-tbl td.lbl{background:var(--bg2);font-weight:600;width:140px;color:var(--text2);white-space:nowrap}
.notice{padding:9px 12px;border-radius:6px;font-size:10px;line-height:1.6;margin-bottom:10px}
.notice.blue{background:var(--blue2);color:var(--blue)}
.notice.green{background:var(--green2);color:var(--green)}
.notice.amber{background:var(--amber2);color:var(--amber)}
.notice.red{background:var(--red2);color:var(--red)}
.body-box{padding:10px;background:var(--bg2);border-radius:6px;font-size:11px;line-height:1.75;white-space:pre-wrap}
.sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
.sig-box{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg2)}
.sig-role{font-size:9px;color:var(--text3);font-weight:600;margin-bottom:6px}
.sig-line{border-bottom:1px solid var(--text1);min-height:28px;padding:4px 0;font-weight:700}
.sig-date{font-size:10px;color:var(--text3);margin-top:6px}
#status-bar{font-size:11px;padding:8px 20px;background:#fff;border-bottom:1px solid var(--border);color:var(--text2)}
@media print{#hdr .hdr-r,#tab-bar,#status-bar,.no-print{display:none!important}#hdr{position:static}#pg{padding:4px 0;max-width:100%}.doc-page{display:block!important}.doc-wrap{border:none;padding:18px 0}}
</style>
</head>
<body>
<div id="hdr">
  <div class="logo">ComplAIs <small>심사원 위촉계약 · 비밀유지서약 — ISO/IEC 17021-1</small></div>
  <div class="hdr-r no-print">
    <button type="button" class="hbtn" onclick="window.print()">인쇄</button>
    <button type="button" class="hbtn pri" id="btn-accept" disabled>열람 후 배정 동의</button>
  </div>
</div>
<div id="status-bar">문서를 불러오는 중…</div>
<div id="tab-bar" class="no-print">
  <button type="button" class="tab active" data-tab="0" onclick="showTab(0)">① 심사원 위촉계약서</button>
  <button type="button" class="tab" data-tab="1" onclick="showTab(1)">② 비밀유지서약서(NDA)</button>
</div>
<div id="pg">
  <div class="doc-page active" id="page-0"></div>
  <div class="doc-page" id="page-1"></div>
</div>
<script>
(function(){
  const API = "/api/v1";
  const params = new URLSearchParams(location.search);
  const assignmentId = params.get("assignment_id");
  const preferDoc = (params.get("doc") || "contract").toLowerCase();
  let payload = null;

  function authHeaders(json){
    const h = {};
    const t = localStorage.getItem("access_token") || localStorage.getItem("token") || "";
    if (t) h["Authorization"] = t.startsWith("Bearer ") ? t : ("Bearer " + t);
    if (json) h["Content-Type"] = "application/json";
    return h;
  }
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }
  function showTab(i){
    document.querySelectorAll(".tab").forEach((t,idx)=>{
      t.classList.toggle("active", idx===i);
    });
    document.querySelectorAll(".doc-page").forEach((p,idx)=>{
      p.classList.toggle("active", idx===i);
    });
  }
  window.showTab = showTab;

  function renderDoc(doc){
    const d = (doc && doc.data) || {};
    const parties = d.parties || {};
    const eng = d.engagement || {};
    const fee = d.fee_terms || {};
    const sections = d.sections || [];
    const signed = !!(d.signed_at || (doc && (doc.status||"").toLowerCase()==="signed"));
    const secHtml = sections.map(s => `
      <div class="sec">
        <div class="sec-h"><span class="sec-no">${esc(s.no)}</span> ${esc(s.title)}</div>
        <div class="body-box">${esc(s.body)}</div>
      </div>`).join("");
    return `
<div class="doc-wrap">
  <div class="doc-hd">
    <div class="doc-tag">${esc(d.iso_ref || "ISO/IEC 17021-1 §5.1.2 · §8.4")}</div>
    <div class="doc-title">${esc(d.title || doc.title || "문서")}</div>
    <div class="doc-sub">배정 동의(accept) = 본 문서 열람·동의·전자서명</div>
    <div class="doc-meta">
      <span class="dm-lbl">배정 ID</span><span>${esc(d.assignment_id || "")}</span>
      <span class="dm-lbl">계약</span><span>#${esc(eng.contract_id || d.contract_id || "")} ${esc(eng.contract_no || "")}</span>
      <span class="dm-lbl">상태</span><span>${esc(signed ? "서명완료" : (doc.status || "draft"))}</span>
    </div>
  </div>
  ${signed ? '<div class="notice green">이미 동의·서명된 문서입니다. signed_at='+esc(d.signed_at||"")+'</div>' : '<div class="notice blue">아래 내용을 확인한 뒤 상단 <b>열람 후 배정 동의</b>를 누르면 위촉계약·NDA에 동의한 것으로 처리됩니다.</div>'}
  <div class="sec">
    <div class="sec-h"><span class="sec-no">P</span> 당사자 요약</div>
    <table class="form-tbl">
      <tr><td class="lbl">인증기관 (갑)</td><td>${esc(parties.cb_name||"—")}</td></tr>
      <tr><td class="lbl">심사원 (을)</td><td>${esc(parties.auditor_qual_label||parties.auditor_name||"—")}</td></tr>
      <tr><td class="lbl">피심사조직</td><td>${esc(parties.company_name||"—")}</td></tr>
      <tr><td class="lbl">표준 / 기간 / 역할</td><td>${esc(eng.standards||"—")} · ${esc(eng.period_label||"—")} · ${esc(eng.role_label||"—")}</td></tr>
      <tr><td class="lbl">수수료</td><td>${esc(fee.summary||"—")}</td></tr>
    </table>
  </div>
  ${secHtml}
  <div class="sec">
    <div class="sec-h"><span class="sec-no">S</span> 서명</div>
    <div class="sig-grid">
      <div class="sig-box">
        <div class="sig-role">인증기관 (갑)</div>
        <div class="sig-line">${esc(parties.cb_name||"—")}</div>
        <div class="sig-date">배정 통지 시 전자 발행</div>
      </div>
      <div class="sig-box">
        <div class="sig-role">심사원 (을) — accept 동의</div>
        <div class="sig-line">${esc(signed ? (parties.auditor_name||"동의완료") : "동의 대기")}</div>
        <div class="sig-date">${esc(d.signed_at || "일자: 동의 시 기록")}</div>
      </div>
    </div>
  </div>
</div>`;
  }

  function byKind(docs, kind){
    const want = kind === "nda" ? "NDA" : "AUDITOR_CONTRACT";
    return (docs||[]).find(d => (d.doc_type||"") === want)
      || (docs||[]).find(d => ((d.data||{}).doc_kind||"") === kind);
  }

  async function load(){
    const bar = document.getElementById("status-bar");
    const btn = document.getElementById("btn-accept");
    if (!assignmentId){
      bar.textContent = "assignment_id 쿼리가 필요합니다.";
      bar.className = "notice red";
      return;
    }
    try{
      const res = await fetch(API + "/auditor/assignments/" + encodeURIComponent(assignmentId) + "/engagement-docs", {
        headers: authHeaders()
      });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) throw new Error(data.detail || ("조회 실패 " + res.status));
      payload = data;
      const docs = data.documents || [];
      const contractDoc = byKind(docs, "contract");
      const ndaDoc = byKind(docs, "nda");
      document.getElementById("page-0").innerHTML = renderDoc(contractDoc || {title:"위촉계약서", data:{}});
      document.getElementById("page-1").innerHTML = renderDoc(ndaDoc || {title:"NDA", data:{}});
      if (preferDoc === "nda") showTab(1);
      const can = !!data.can_accept;
      btn.disabled = !can;
      btn.textContent = can ? "열람 후 배정 동의" : "이미 동의됨 / 동의 불가 상태";
      bar.textContent = "배정 #" + assignmentId
        + " · 상태 " + ((data.assignment&&data.assignment.status)||"—")
        + " · 동의=문서 열람·합의";
    }catch(e){
      bar.textContent = e.message || "로드 실패 (로그인 후 다시 열어 주세요)";
      bar.style.background = "var(--red2)";
      bar.style.color = "var(--red)";
    }
  }

  document.getElementById("btn-accept").addEventListener("click", async ()=>{
    if (!assignmentId || !payload || !payload.can_accept) return;
    if (!confirm("위촉계약서와 NDA를 열람·동의하고 배정에 수락하시겠습니까?")) return;
    const btn = document.getElementById("btn-accept");
    btn.disabled = true;
    try{
      const res = await fetch(API + "/auditor/assignments/" + encodeURIComponent(assignmentId) + "/accept", {
        method: "POST",
        headers: authHeaders(true)
      });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) throw new Error(data.detail || ("동의 실패 " + res.status));
      alert("배정에 동의했습니다. 위촉계약·NDA가 서명 처리되었습니다.");
      await load();
    }catch(e){
      alert(e.message || "동의 실패");
      btn.disabled = false;
    }
  });

  load();
})();
</script>
</body>
</html>
