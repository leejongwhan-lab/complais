<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComplAIs - CB Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-8">
  <div class="max-w-7xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">CB 어드민 대시보드</h1>
        <p class="text-sm text-slate-500 mt-1">인증 신청 검토, MD 확정 및 심사원 배정을 관리합니다.</p>
      </div>
      <div class="flex items-center gap-3">
        <a href="/cb-portal" class="text-xs text-blue-600 hover:underline">CB 포털</a>
        <a href="/cb-portal/contracts" class="text-xs text-blue-600 hover:underline">계약</a>
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
          CB Scope Active
        </span>
      </div>
    </div>

    <!-- Status KPI Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">신규 신청</p>
        <p id="kpi-pending" class="text-3xl font-extrabold text-blue-600 mt-2">-</p>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">MD 검토 완료</p>
        <p id="kpi-reviewed" class="text-3xl font-extrabold text-amber-500 mt-2">-</p>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">승인 완료 (배정 대기)</p>
        <p id="kpi-approved" class="text-3xl font-extrabold text-emerald-600 mt-2">-</p>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">심사원 배정 완료</p>
        <p id="kpi-assigned" class="text-3xl font-extrabold text-purple-600 mt-2">-</p>
      </div>
    </div>

    <!-- Application List Table -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-800">인증 신청 목록</h2>
        <button type="button" onclick="loadApplications()" class="text-xs text-blue-600 hover:underline">🔄 새로고침</button>
      </div>
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold">
          <tr>
            <th class="p-4">ID</th>
            <th class="p-4">신청 기업명</th>
            <th class="p-4">신청 표준</th>
            <th class="p-4">상태</th>
            <th class="p-4">신청일</th>
            <th class="p-4 text-right">작업</th>
          </tr>
        </thead>
        <tbody id="app-list-body" class="divide-y divide-slate-100">
          <tr><td colspan="6" class="p-8 text-center text-slate-400">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="/static/js/cb_admin_api.js"></script>
  <script>
    function escapeHtml(t) {
      const d = document.createElement("div");
      d.textContent = t == null ? "" : String(t);
      return d.innerHTML;
    }

    function statusBadge(status) {
      const s = String(status || "").toLowerCase();
      const map = {
        submitted: "bg-blue-50 text-blue-700",
        reviewed: "bg-amber-50 text-amber-700",
        approved: "bg-emerald-50 text-emerald-700",
        assigned: "bg-purple-50 text-purple-700",
      };
      return map[s] || "bg-slate-100 text-slate-600";
    }

    function updateKpis(rows) {
      const counts = { submitted: 0, reviewed: 0, approved: 0, assigned: 0 };
      rows.forEach((app) => {
        const s = String(app.status || "").toLowerCase();
        if (counts[s] != null) counts[s] += 1;
      });
      document.getElementById("kpi-pending").textContent = counts.submitted;
      document.getElementById("kpi-reviewed").textContent = counts.reviewed;
      document.getElementById("kpi-approved").textContent = counts.approved;
      document.getElementById("kpi-assigned").textContent = counts.assigned;
    }

    async function loadApplications() {
      const tbody = document.getElementById("app-list-body");
      try {
        if (!localStorage.getItem("access_token")) {
          tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-400">로그인이 필요합니다. <a class="text-blue-600 underline" href="/login.html">로그인</a></td></tr>';
          return;
        }

        const data = await CBAdminAPI.listApplications();
        tbody.innerHTML = "";

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-400">신청 내역이 없습니다.</td></tr>';
          updateKpis([]);
          return;
        }

        updateKpis(data);

        data.forEach((app) => {
          const status = String(app.status || "").toLowerCase();
          let actionBtn = "";
          if (status === "submitted" || status === "reviewed") {
            actionBtn = `<a href="/cb-portal/review.html?id=${app.id}" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-medium">검토/승인</a>`;
          } else if (status === "approved") {
            actionBtn = `<a href="/cb-portal/assign.html?id=${app.id}" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-medium">심사원 배정</a>`;
          } else {
            actionBtn = `<span class="text-xs text-slate-400 font-medium">배정완료</span>`;
          }

          tbody.innerHTML += `
            <tr class="hover:bg-slate-50">
              <td class="p-4 font-semibold">#${app.id}</td>
              <td class="p-4 font-medium text-slate-900">${escapeHtml(app.company_name || "기업명 미기재")}</td>
              <td class="p-4"><span class="bg-slate-100 px-2 py-1 rounded text-xs">${escapeHtml(Array.isArray(app.standards_json) ? app.standards_json.join(", ") : (app.standards_json || "ISO 9001"))}</span></td>
              <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${statusBadge(status)}">${escapeHtml(status)}</span></td>
              <td class="p-4 text-slate-500">${app.created_at ? String(app.created_at).substring(0, 10) : "-"}</td>
              <td class="p-4 text-right">${actionBtn}</td>
            </tr>
          `;
        });
      } catch (e) {
        console.error(e);
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500">로드 실패: ${escapeHtml(e.message || e)}</td></tr>`;
      }
    }

    document.addEventListener("DOMContentLoaded", loadApplications);
  </script>
</body>
</html>
