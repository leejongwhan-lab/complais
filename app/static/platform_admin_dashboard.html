<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>ComplAIs — 플랫폼 관리자</title>
    <!-- 디자인 토큰 및 컴포넌트 CSS 체이닝 적용 -->
    <link rel="stylesheet" href="components_v3.css">
    <style>
        body { display: flex; min-height: 100vh; background-color: var(--gray-line-1); margin: 0; }
        .admin-sidebar { width: 240px; background: #ffffff; border-right: 1px solid var(--gray-line-2); padding: 20px 16px; }
        .admin-main { flex: 1; padding: 32px; }
        .grid-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; border: 1px solid var(--gray-line-2); }
        .card-title { font: var(--font-caption); color: var(--font-secondary); }
        .card-value { font: var(--font-h2); color: var(--primary-purple); margin-top: 8px; }
        .data-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
        .data-table th, .data-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--gray-line-2); font: var(--font-body-small); }
        .data-table th { background: var(--gray-line-1); font-weight: var(--font-weight-semibold); color: var(--font-secondary); }
    </style>
</head>
<body>

    <!-- 사이드바 -->
    <aside class="admin-sidebar">
        <h2 style="font: var(--font-h3); color: var(--primary-purple);">ComplAIs</h2>
        <span class="badge badge-purple" style="margin-bottom: 24px;">PLATFORM ADMIN</span>
        <nav>
            <ul style="list-style: none; padding: 0; line-height: 2.2; font: var(--font-body-small);">
                <li><strong>📊 대시보드</strong></li>
                <li>🏛️ 인증기관(CB) 현황 & 과금</li>
                <li>🏭 기업 현황</li>
                <li>🔍 인증심사원 마스터</li>
                <li>🧾 인정범위 승인 요청</li>
                <li>⚙️ 산출 지침(MD/탄소) 관리</li>
            </ul>
        </nav>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="admin-main">
        <h1 style="font: var(--font-h1);">플랫폼 현황 및 통합 관리</h1>
        
        <!-- 현황 요약 타일 -->
        <div class="grid-cards">
            <div class="card"><div class="card-title">인증기관(CB)</div><div class="card-value">12 개소</div></div>
            <div class="card"><div class="card-title">등록 기업</div><div class="card-value">1,480 개사</div></div>
            <div class="card"><div class="card-title">등록 심사원</div><div class="card-value">342 명</div></div>
            <div class="card"><div class="card-title">인정범위 검토대기</div><div class="card-value" style="color: var(--sec-red);">3 건</div></div>
        </div>

        <!-- 인정서 승인 요청 관리 테이블 -->
        <div class="card">
            <h3 style="font: var(--font-h3); margin-bottom: 16px;">인증기관 인정범위(Accreditation Scope) 승인 요청</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>인증기관명</th>
                        <th>인정기구</th>
                        <th>신청 ISO 표준 / 코드</th>
                        <th>인정서 파일</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="accreditation-tbody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--font-tertiary);">불러오는 중...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>
