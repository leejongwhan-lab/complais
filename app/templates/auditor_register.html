<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>심사원 개인 가입 - complAIs</title>
  <link rel="stylesheet" href="/static/css/main.css?v=20260807su" />
  <link rel="stylesheet" href="/static/css/portal.css?v=20260807su" />
  <link rel="stylesheet" href="/static/css/style.css?v=20260807su" />
  <style>
    body.register-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px 0;
      background: var(--bg-secondary, #f5f7fb);
    }
    .register-card {
      width: min(560px, 92vw);
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    }
    .brand-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
    .brand-wrap .brand-logo { height: 34px; }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    .lead { margin: 0 0 18px; color: #64748b; font-size: 0.95rem; }
    .btn-primary {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .error { color: #dc2626; margin-top: 12px; min-height: 1.2em; }
    .links { margin-top: 16px; text-align: center; font-size: 0.9rem; }
    .links a { color: #2563eb; text-decoration: none; }
    .hint { font-size: 0.85rem; color: #64748b; margin-top: 6px; }
  </style>
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="/static/js/daum_postcode.js?v=20260807su"></script>
  <script src="/static/js/validation.js?v=20260807su"></script>
</head>
<body class="portal-page register-page">
  <form class="register-card portal-form" id="form">
    <div class="brand-wrap">
      <img src="/static/brand/complais-logo.png" alt="complAIs" class="brand-logo" />
    </div>
    <h1>심사원 개인 회원가입</h1>
    <p class="lead">특정 인증기관(CB)에 종속되지 않는 개인 Identity로 가입합니다. 소속/자격은 로그인 후 신청합니다.</p>

    <div class="form-row">
      <label for="name">성명</label>
      <input id="name" required />
    </div>
    <div class="form-row">
      <label for="email">이메일</label>
      <input id="email" type="email" required />
    </div>
    <div class="form-row">
      <label for="password">비밀번호</label>
      <input id="password" type="password" required />
    </div>
    <div class="form-row">
      <label for="phone">연락처</label>
      <input id="phone" required />
    </div>
    <div class="form-row">
      <label for="birth_date">생년월일</label>
      <input id="birth_date" type="date" />
    </div>
    <div class="form-row">
      <label for="zipcode">우편번호</label>
      <div class="addr-row">
        <input type="text" id="zipcode" class="addr-zip" readonly placeholder="우편번호" />
        <button
          type="button"
          class="btn-postcode"
          data-postcode-zip="zipcode"
          data-postcode-addr="address"
          data-postcode-detail="address_detail"
          onclick="execDaumPostcode('zipcode','address','address_detail')"
        >주소 검색</button>
      </div>
    </div>
    <div class="form-row">
      <label for="address">주소</label>
      <input type="text" id="address" readonly placeholder="도로명/지번 주소" />
    </div>
    <div class="form-row">
      <label for="address_detail">상세주소</label>
      <input type="text" id="address_detail" placeholder="상세주소 (선택)" />
    </div>
    <div class="form-row">
      <label for="apply_grade">희망 등급</label>
      <select id="apply_grade">
        <option value="trainee">심사원보</option>
        <option value="auditor" selected>심사원</option>
        <option value="lead_auditor">선임심사원</option>
        <option value="verified_auditor">검증심사원</option>
      </select>
    </div>
    <div class="hint">CB 승인 등급과 별개입니다. 실제 자격은 CB 승인 후 부여됩니다.</div>

    <button type="submit" class="btn-primary">개인 계정 생성</button>
    <div class="error" id="error"></div>
    <div class="links">
      <a href="/signup.html">← 가입 유형 선택</a> ·
      <a href="/login.html">로그인</a>
    </div>
  </form>
  <script>
    if (window.ComplaisValidation) {
      ComplaisValidation.bindField(document.getElementById("phone"), "phone");
      ComplaisValidation.bindField(document.getElementById("email"), "email");
    }
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";
      if (window.ComplaisValidation) {
        const v = ComplaisValidation.validateFields([
          { el: document.getElementById("phone"), kind: "phone", required: true },
          { el: document.getElementById("email"), kind: "email", required: true },
        ]);
        if (!v.ok) { errorEl.textContent = v.message; return; }
      }
      const zip = (document.getElementById("zipcode").value || "").trim();
      const baseAddr = (document.getElementById("address").value || "").trim();
      const detail = (document.getElementById("address_detail").value || "").trim();
      const payload = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        phone: document.getElementById("phone").value.trim(),
        birth_date: document.getElementById("birth_date").value || null,
        apply_grade: document.getElementById("apply_grade").value,
        zip_code: zip || null,
        address: baseAddr || "미입력",
        detail_address: detail || "미입력",
      };
      try {
        const res = await fetch("/api/v1/auth/register/auditor", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || `가입 실패 (HTTP ${res.status})`);
        alert(data.message || "가입이 완료되었습니다.");
        window.location.href = "/login.html";
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
